allowBuilds:
  '@firebase/util': set this to true or false
  esbuild: true
  protobufjs: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - unrs-resolver

# Transitive-only vulnerabilities that can't be fixed by bumping our own
# direct deps (pulled in pinned by sanitize-html and firebase-admin's own
# dependency chains) — see the src/ security review for details.
#
# uuid is pinned to the exact patched version, not an open '>=' range: 12.0.0
# dropped the `require()`/CJS export condition entirely (ESM-only), which
# breaks gaxios's `require('uuid')` when Next.js externalizes firebase-admin
# for the server bundle (ERR_REQUIRE_ESM crash on every Firestore-backed
# route in production). 11.1.1 is the first version with the security fix
# and the last one that still ships a CJS entry point.
overrides:
  postcss@<8.5.23: '>=8.5.23'
  nanoid@<3.3.17: '>=3.3.17'
  uuid: '11.1.1'
