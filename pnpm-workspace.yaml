allowBuilds:
  '@firebase/util': set this to true or false
  protobufjs: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - unrs-resolver

# Transitive-only vulnerabilities that can't be fixed by bumping our own
# direct deps (pulled in pinned by sanitize-html and firebase-admin's own
# dependency chains) — see the src/ security review for details.
overrides:
  postcss@<8.5.23: '>=8.5.23'
  nanoid@<3.3.17: '>=3.3.17'
  uuid@<11.1.1: '>=11.1.1'
